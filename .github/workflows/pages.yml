# Publishes docs/ (the project page) to the gh-pages branch.
# GitHub auto-enables Pages for a public repository the first time gh-pages appears.
# Never hand-edit gh-pages: it is generated from docs/ and force-pushed on every run.
name: Publish project page

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write # pushes a branch; does not call the Pages API

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push docs/ to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -r docs "$RUNNER_TEMP/site"
          touch "$RUNNER_TEMP/site/.nojekyll"
          cd "$RUNNER_TEMP/site"
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Publish project page from ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
